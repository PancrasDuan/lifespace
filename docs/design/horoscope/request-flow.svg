<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1680" viewBox="0 0 1760 1680" role="img" aria-labelledby="title desc"><title id="title">LifeSpace 星座运势当前请求流程与实测耗时</title><desc id="desc">浏览器内存未命中时，请求经本地 Wrangler 转发至 Cloudflare Worker，先读取 KV；有效当日缓存匿名返回，未命中才验证 Supabase 会话和白名单，之后调用 ALAPI，校验内容并等待 KV 写入后返回。红色标出实测主要等待阶段。</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547168" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#32785c" /></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b25335" /></marker><style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style></defs><rect x="0" y="0" width="1760" height="1680" rx="0" fill="#f7f8f4" stroke="none" /><rect x="0" y="0" width="1760" height="7" rx="0" fill="#203f35" stroke="none" /><text x="64" y="52" font-size="14" fill="#6a7e70" font-weight="600" text-anchor="start">LIFESPACE  /  REQUEST MAP  /  2026.10.22</text><text x="64" y="108" font-size="39" fill="#193d31" font-weight="650" text-anchor="start">星座运势：一次点击，哪些请求真的发生？</text><text x="64" y="146" font-size="19" fill="#607367" font-weight="400" text-anchor="start">当前方案：当日有效 KV 缓存匿名可读；缓存未命中先鉴权，再按需回源。</text><rect x="64" y="177" width="1632" height="100" rx="14" fill="#eaf0e6" stroke="#d7e1d1" /><rect x="84" y="194" width="174" height="31" rx="8" fill="#d5e4ce" stroke="none" /><text x="171.0" y="215" font-size="16" fill="#345d38" font-weight="600" text-anchor="middle">先看浏览器内存</text><text x="280" y="216" font-size="20" fill="#294d3a" font-weight="550" text-anchor="start">当天、同星座且内存结果仍有效 → 直接展示，不发送业务请求。</text><text x="86" y="250" font-size="18" fill="#536c55" font-weight="400" text-anchor="start">未命中内存才继续下图。SDK 取已有会话；正反面共享同一份数据，翻转和返回不请求接口。</text><rect x="300" y="300" width="230" height="985" rx="14" fill="#f3eee4" stroke="none" /><text x="415.0" y="294" font-size="14" fill="#96744f" font-weight="550" text-anchor="middle">仅当前预览多这一跳</text><line x1="161.5" x2="161.5" y1="388" y2="1270" stroke="#d3ddd4" stroke-width="1.4" stroke-dasharray="4 7" /><line x1="415.0" x2="415.0" y1="388" y2="1270" stroke="#d3ddd4" stroke-width="1.4" stroke-dasharray="4 7" /><line x1="700.0" x2="700.0" y1="388" y2="1270" stroke="#d3ddd4" stroke-width="1.4" stroke-dasharray="4 7" /><line x1="1040.0" x2="1040.0" y1="388" y2="1270" stroke="#d3ddd4" stroke-width="1.4" stroke-dasharray="4 7" /><line x1="1305.0" x2="1305.0" y1="388" y2="1270" stroke="#d3ddd4" stroke-width="1.4" stroke-dasharray="4 7" /><line x1="1580.0" x2="1580.0" y1="388" y2="1270" stroke="#d3ddd4" stroke-width="1.4" stroke-dasharray="4 7" /><rect x="64" y="308" width="195" height="78" rx="14" fill="#ffffff" stroke="#d5ded6" /><text x="161.5" y="339" font-size="21" fill="#203b36" font-weight="600" text-anchor="middle">浏览器</text><text x="161.5" y="365" font-size="14" fill="#203b36" font-weight="400" text-anchor="middle">React Query / 当前会话</text><rect x="310" y="308" width="210" height="78" rx="14" fill="#ffffff" stroke="#d5ded6" /><text x="415.0" y="339" font-size="21" fill="#203b36" font-weight="600" text-anchor="middle">本地 Wrangler</text><text x="415.0" y="365" font-size="14" fill="#203b36" font-weight="400" text-anchor="middle">127.0.0.1:8788 转发</text><rect x="580" y="308" width="240" height="78" rx="14" fill="#203f35" stroke="#203f35" /><text x="700.0" y="339" font-size="21" fill="#f3f7eb" font-weight="600" text-anchor="middle">Cloudflare Worker</text><text x="700.0" y="365" font-size="14" fill="#f3f7eb" font-weight="400" text-anchor="middle">正式 Hono 路由 / 业务编排</text><rect x="930" y="308" width="220" height="78" rx="14" fill="#ffffff" stroke="#d5ded6" /><text x="1040.0" y="339" font-size="21" fill="#203b36" font-weight="600" text-anchor="middle">Supabase Auth</text><text x="1040.0" y="365" font-size="14" fill="#203b36" font-weight="400" text-anchor="middle">仅运势缓存未命中鉴权</text><rect x="1210" y="308" width="190" height="78" rx="14" fill="#ffffff" stroke="#d5ded6" /><text x="1305.0" y="339" font-size="21" fill="#203b36" font-weight="600" text-anchor="middle">Cloudflare KV</text><text x="1305.0" y="365" font-size="14" fill="#203b36" font-weight="400" text-anchor="middle">共享当天完整运势</text><rect x="1465" y="308" width="230" height="78" rx="14" fill="#ffffff" stroke="#d5ded6" /><text x="1580.0" y="339" font-size="21" fill="#203b36" font-weight="600" text-anchor="middle">ALAPI</text><text x="1580.0" y="365" font-size="14" fill="#203b36" font-weight="400" text-anchor="middle">中文星座运势数据源</text><line x1="161.5" x2="415.0" y1="431" y2="431" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" /><rect x="167.15" y="407" width="242.2" height="24" rx="5" fill="#f7f8f4" stroke="none" /><text x="288.25" y="420" font-size="15" fill="#547168" font-weight="400" text-anchor="middle">GET /api/horoscope?sign=…</text><line x1="415.0" x2="700.0" y1="480" y2="480" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" /><rect x="468.82" y="455" width="177.36" height="25" rx="5" fill="#f7f8f4" stroke="none" /><text x="557.5" y="469" font-size="16" fill="#547168" font-weight="400" text-anchor="middle">携带会话 / 远程转发</text><line x1="700.0" x2="1305.0" y1="537" y2="537" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" /><rect x="879.895" y="511" width="245.21" height="26" rx="5" fill="#f7f8f4" stroke="none" /><text x="1002.5" y="526" font-size="17" fill="#547168" font-weight="400" text-anchor="middle">KV.get（北京日期 + 星座）</text><line x1="1305.0" x2="700.0" y1="582" y2="582" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" stroke-dasharray="7 6" /><rect x="879.5" y="557" width="246" height="25" rx="5" fill="#f7f8f4" stroke="none" /><text x="1002.5" y="571" font-size="16" fill="#547168" font-weight="400" text-anchor="middle">校验结构、星座、日期与有效期</text><rect x="79" y="621" width="1616" height="655" rx="14" fill="none" stroke="#cbd7cb" /><text x="96" y="646" font-size="14" fill="#6c8172" font-weight="600" text-anchor="start">两条互斥路径</text><rect x="608" y="636" width="173" height="31" rx="8" fill="#dbeada" stroke="none" /><text x="694.5" y="657" font-size="16" fill="#2d6849" font-weight="600" text-anchor="middle">① KV 有效命中</text><line x1="700.0" x2="415.0" y1="691" y2="691" stroke="#32785c" stroke-width="2.3" marker-end="url(#green)" /><rect x="450.65999999999997" y="666" width="213.68" height="25" rx="5" fill="#f7f8f4" stroke="none" /><text x="557.5" y="680" font-size="16" fill="#32785c" font-weight="400" text-anchor="middle">直接返回 cacheHit=true</text><line x1="415.0" x2="161.5" y1="731" y2="731" stroke="#32785c" stroke-width="2.3" marker-end="url(#green)" /><rect x="245.25" y="706" width="86" height="25" rx="5" fill="#f7f8f4" stroke="none" /><text x="288.25" y="720" font-size="16" fill="#32785c" font-weight="400" text-anchor="middle">渲染卡片</text><text x="933" y="692" font-size="18" fill="#32785c" font-weight="550" text-anchor="start">匿名可读，不请求 Auth 或 ALAPI，不写 KV。</text><text x="933" y="724" font-size="17" fill="#63816c" font-weight="400" text-anchor="start">实测命中：Worker 105 ms；非延迟保证。</text><line x1="96" x2="1680" y1="760" y2="760" stroke="#cbd7cb" stroke-dasharray="4 5" /><rect x="608" y="776" width="202" height="31" rx="8" fill="#f5e2d0" stroke="none" /><text x="709.0" y="797" font-size="16" fill="#a25a2f" font-weight="600" text-anchor="middle">② KV 未命中 / 无效</text><line x1="700.0" x2="1040.0" y1="831" y2="831" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" /><rect x="776.635" y="805" width="186.73" height="26" rx="5" fill="#f7f8f4" stroke="none" /><text x="870.0" y="820" font-size="17" fill="#547168" font-weight="400" text-anchor="middle">GET /auth/v1/user</text><line x1="1040.0" x2="700.0" y1="874" y2="874" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" stroke-dasharray="7 6" /><rect x="750.965" y="848" width="238.07" height="26" rx="5" fill="#f7f8f4" stroke="none" /><text x="870.0" y="863" font-size="17" fill="#547168" font-weight="400" text-anchor="middle">有效会话 + 当前邮箱白名单</text><text x="933" y="917" font-size="17" fill="#975034" font-weight="400" text-anchor="start">匿名 401 / 非白名单 403；均不回源。</text><rect x="586.175" y="909" width="227.65" height="24" rx="5" fill="#f7f8f4" stroke="none" /><text x="700.0" y="922" font-size="15" fill="#536b63" font-weight="400" text-anchor="middle">获准后才加入并发合并 / 节流</text><line x1="700.0" x2="1580.0" y1="961" y2="961" stroke="#b25335" stroke-width="2.3" marker-end="url(#red)" /><rect x="895.36" y="934" width="489.28" height="27" rx="5" fill="#f7f8f4" stroke="none" /><text x="1140.0" y="950" font-size="18" fill="#b25335" font-weight="400" text-anchor="middle">POST /api/star · Token 仅在服务端 · 只消费 day</text><rect x="967.1949999999999" y="971" width="345.61" height="30" rx="5" fill="#fbeee2" stroke="none" /><text x="1140.0" y="990" font-size="21" fill="#b25335" font-weight="400" text-anchor="middle">首包等待探针：2,705–5,096 ms</text><line x1="1580.0" x2="700.0" y1="1034" y2="1034" stroke="#b25335" stroke-width="2.3" marker-end="url(#red)" stroke-dasharray="7 6" /><rect x="942.085" y="1008" width="395.83" height="26" rx="5" fill="#f7f8f4" stroke="none" /><text x="1140.0" y="1023" font-size="17" fill="#b25335" font-weight="400" text-anchor="middle">响应 → 检查 HTTP、业务状态、今日日期与字段</text><line x1="700.0" x2="1305.0" y1="1091" y2="1091" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" /><rect x="831.36" y="1065" width="342.28" height="26" rx="5" fill="#f7f8f4" stroke="none" /><text x="1002.5" y="1080" font-size="17" fill="#547168" font-weight="400" text-anchor="middle">await KV.put（有效期至北京次日零点）</text><line x1="1305.0" x2="700.0" y1="1135" y2="1135" stroke="#547168" stroke-width="2.3" marker-end="url(#normal)" stroke-dasharray="7 6" /><rect x="896.895" y="1109" width="211.20999999999998" height="26" rx="5" fill="#f7f8f4" stroke="none" /><text x="1002.5" y="1124" font-size="17" fill="#547168" font-weight="400" text-anchor="middle">写入完成：220–246 ms</text><line x1="700.0" x2="415.0" y1="1204" y2="1204" stroke="#32785c" stroke-width="2.3" marker-end="url(#green)" /><rect x="475.7" y="1179" width="163.6" height="25" rx="5" fill="#f7f8f4" stroke="none" /><text x="557.5" y="1193" font-size="16" fill="#32785c" font-weight="400" text-anchor="middle">返回当天完整 JSON</text><line x1="415.0" x2="161.5" y1="1243" y2="1243" stroke="#32785c" stroke-width="2.3" marker-end="url(#green)" /><rect x="204.425" y="1219" width="167.65" height="24" rx="5" fill="#f7f8f4" stroke="none" /><text x="288.25" y="1232" font-size="15" fill="#32785c" font-weight="400" text-anchor="middle">渲染正面 / 翻转复用</text><rect x="64" y="1300" width="800" height="116" rx="14" fill="#ffffff" stroke="#d9e1d7" /><text x="86" y="1330" font-size="18" fill="#274f3c" font-weight="600" text-anchor="start">日期与错误边界</text><text x="86" y="1361" font-size="17" fill="#586f62" font-weight="400" text-anchor="start">距零点不足 60 秒跳过写入；写失败可返回本次合法内容。</text><text x="86" y="1389" font-size="17" fill="#586f62" font-weight="400" text-anchor="start">KV 读失败停止回源；昨日内容不冒充今日，不缓存错误。</text><rect x="884" y="1300" width="812" height="116" rx="14" fill="#ffffff" stroke="#d9e1d7" /><text x="906" y="1330" font-size="18" fill="#274f3c" font-weight="600" text-anchor="start">并发与重试边界</text><text x="906" y="1361" font-size="17" fill="#586f62" font-weight="400" text-anchor="start">同实例并发有限等待；回源节流与失败退避，无后台预热。</text><text x="906" y="1389" font-size="17" fill="#586f62" font-weight="400" text-anchor="start">会话明确过期才续期重试一次；没有全局恰好一次保证。</text><rect x="64" y="1440" width="1632" height="154" rx="14" fill="#f8ede3" stroke="#e5c9b6" /><text x="86" y="1475" font-size="23" fill="#975034" font-weight="600" text-anchor="start">定位网络 I/O：两种计时口径，不能直接当作同一段耗时</text><text x="86" y="1510" font-size="18" fill="#795c48" font-weight="400" text-anchor="start">截图：ALAPI 日志多数 1–5 ms，是提供方记录的服务端耗时；不是 Worker 发起请求到收完响应的整段时间。</text><text x="86" y="1541" font-size="18" fill="#795c48" font-weight="400" text-anchor="start">探针：响应头等待 2.705–5.096 s，约 8.7 KB 正文未观察到额外等待；本机对照也出现 TLS 连接延迟。</text><text x="86" y="1572" font-size="18" fill="#795c48" font-weight="400" text-anchor="start">判断：网络 / 访问链路值得优先排查；当前尚不能进一步分离 DNS、TLS、路由、连接复用或其他处理开销。</text><text x="64" y="1635" font-size="18" fill="#5c7364" font-weight="400" text-anchor="start">生产路径：浏览器 → 生产域名的 Cloudflare Worker → Auth / KV / ALAPI；没有本机 Wrangler 转发这一跳。</text><text x="1696" y="1665" font-size="13" fill="#7d8e80" font-weight="400" text-anchor="end">源码：HoroscopeCard / authorizedFetch / Worker / readHoroscope  ·  非地理拓扑  ·  网站界面仍需登录</text></svg>
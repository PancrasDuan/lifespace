/* A 的浅色配色：保留卡片结构，改用薄荷白与深绿色文字。 */
.theme-light{
  --ink:#263f34;--quiet:#65766b;--accent:#486d52;--line:rgba(65,96,73,.15);
  background:radial-gradient(ellipse at 8% 12%,rgba(196,226,205,.55),transparent 48%),radial-gradient(ellipse at 91% 9%,rgba(247,232,201,.55),transparent 43%),radial-gradient(ellipse at 75% 96%,rgba(208,230,221,.6),transparent 50%),#f2f6ef;
}
.theme-light:before{border-color:rgba(140,180,145,.06)}
.theme-light .sidebar{background:rgba(235,243,231,.83);border-color:rgba(90,118,87,.13)}
.theme-light .nav-item.active{background:#dbe8d4;color:#385c42}
.theme-light .nav-settings:hover{background:#e0eadb}
.theme-light .wordmark{color:#304d39}
.theme-light .wordmark span{color:#668663}
.theme-light .wordmark i{background:#668663}
.theme-light .live-dot{box-shadow:0 0 12px rgba(73,126,71,.2)}
.theme-light .search-box{background:rgba(255,255,255,.87);border-color:#d5e2d0;box-shadow:0 8px 30px rgba(60,90,56,.04)}
.theme-light .google-mark{color:#50724d}
.theme-light .search-hint{opacity:.8}
.theme-light .info-panel{background:rgba(255,255,255,.82);border-color:rgba(255,255,255,.95);box-shadow:0 10px 35px rgba(61,91,52,.045),inset 0 1px 0 white}
.theme-light .info-panel:hover{border-color:#baceb2;box-shadow:0 14px 35px rgba(61,91,52,.08)}
.theme-light .weather-symbol{color:#859965;filter:drop-shadow(0 5px 12px rgba(131,156,91,.1))}
.theme-light .rain-note{background:#edf3e5}
.theme-light .lunar-summary b{background:#e6efdf}
.theme-light .inline-error{color:#a15c3b}
.theme-light .page-note{opacity:.85}
.theme-light .modal{background:#f9fcf6;border-color:#dce6d6;box-shadow:0 30px 100px rgba(37,62,40,.18)}
.theme-light .detail-stats>div{background:#eef3e7}
.theme-light .almanac-block.good>b{background:#e3edd9}
.theme-light .almanac-block.avoid>b{background:#f4eade;color:#947258}
.theme-light .primary-button{background:#52764f;color:white}
/* 时间各列共享行轨道，标签、时区、日期及时间基线保持一致。 */
.clock-label{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--quiet)}
.theme-light .time-content{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr));grid-template-rows:auto auto auto;gap:8px 32px;align-items:baseline;min-height:0;padding-bottom:0}
.theme-light .local-clock,.theme-light .world-clock{display:contents}
.theme-light .clock-column:nth-child(1)>*{grid-column:1}
.theme-light .clock-column:nth-child(2)>*{grid-column:2}
.theme-light .clock-column:nth-child(3)>*{grid-column:3}
.theme-light .clock-label{grid-row:1}
.theme-light .local-clock p,.theme-light .world-clock p{grid-row:2;margin:4px 0 0;line-height:1.5}
.theme-light .local-clock>strong,.theme-light .world-clock>strong{grid-row:3;margin:0;line-height:1.17}
.theme-light .world-clock>strong{font-size:40px}
.theme-light .world-more{position:static;grid-column:1/-1;grid-row:4;border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
@media(max-width:720px){
  .theme-light .time-content{grid-template-columns:minmax(0,1.25fr) repeat(2,minmax(0,1fr));gap:7px 10px;padding-bottom:0}
  .theme-light .clock-label{font-size:10px;gap:4px;flex-wrap:nowrap;align-self:start}
  .theme-light .clock-label svg{width:12px;height:12px;display:block;flex-shrink:0}
  .theme-light .local-clock>strong{font-size:40px;letter-spacing:-2px}
  .theme-light .world-clock>strong{font-size:24px;letter-spacing:-1px}
  .theme-light .world-clock p{font-size:8px}
  .theme-light .local-clock p{font-size:9px;letter-spacing:0}
  .theme-light .world-more{font-size:8px;white-space:normal}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.selected-city{font-size:11px;color:var(--quiet);line-height:1.6}

.city-results button{border:1px solid var(--line);background:#f0f5eb;border-radius:8px;text-align:left;padding:10px 12px;color:var(--ink)}
.city-results strong{font-size:12px;font-weight:500;display:block}.city-results span{display:block;font-size:10px;margin-top:4px;color:var(--quiet)}
.city-results button[aria-selected=true],.city-results button:hover{background:#dfebd9}.location-notice{font-size:11px;line-height:1.6;color:var(--quiet)}.city-results>p{font-size:11px;color:var(--quiet)}
@media(max-width:480px){
  .theme-light .time-content{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;align-items:start}
  .theme-light .clock-column{display:flex;flex-direction:column;gap:7px;min-width:0}
  .theme-light .local-clock{grid-column:1/-1}
  .theme-light .clock-label{font-size:11px;gap:5px;white-space:nowrap}
  .theme-light .clock-label>span,.theme-light .clock-label>small{flex-shrink:0;white-space:nowrap}

.modal::-webkit-scrollbar{display:none}

.domain-summary>strong{font-size:54px;font-weight:400;line-height:1;letter-spacing:-2px}
.domain-summary>span,.domain-summary>small{font-size:11px;color:var(--quiet)}

.news-source-options input:before{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:white;top:3px;left:3px;transition:transform .15s}
.news-source-options input:checked{background:var(--accent)}

.news-error{margin:0 18px 10px;font-size:11px;line-height:1.7;color:#9c5a3d}
.news-page-state{padding:30px;text-align:center;color:var(--quiet);font-size:13px}

let enabled=new Set(sources.slice(0,5).map(s=>s[0]));
function icon(id){return icons[id]?'<img class="news-source-icon" src="'+icons[id]+'" alt="">':'<span class="prototype-icon">AI</span>'}
function render(){const active=sources.filter(s=>enabled.has(s[0]));document.querySelector('#count').textContent='按来源浏览 · '+active.length+' 个榜单';document.querySelector('#grid').innerHTML=active.map(([id,label])=>'<article class="news-card" aria-label="'+label+'"><header class="news-card-heading"><div>'+icon(id)+'<h2>'+label+'</h2></div><button aria-label="刷新'+label+'">↻</button></header><div class="news-list" tabindex="0"><ol>'+titles.map((t,i)=>'<li><span class="news-rank">'+(i+1)+'</span><a href="https://aihot.news/hot" target="_blank" rel="noopener noreferrer">'+(id==='aihot'?t:label+'示例新闻标题 '+(i+1))+'</a></li>').join('')+'</ol></div><footer class="news-card-footer"><span>获取时间 10-08 12:20</span><span>示例数据 · 上游未报告时间</span></footer></article>').join('');document.querySelector('#options').innerHTML=sources.map(([id,label])=>'<label>'+icon(id)+'<span>'+label+'</span><input type="checkbox" role="switch" aria-label="'+label+'" data-id="'+id+'" '+(enabled.has(id)?'checked':'')+'></label>').join('');document.querySelector('#state').textContent=enabled.has('aihot')?'开启后 · 6 个榜单':'默认关闭 · 5 个榜单';}
document.querySelector('#grid').addEventListener('click',e=>{const b=e.target.closest('button');if(b){b.textContent='✓';setTimeout(()=>b.textContent='↻',800)}});
const dialog=document.querySelector('#dialog');function openSettings(){dialog.showModal();setTimeout(()=>document.querySelector('[data-id="aihot"]').scrollIntoView({block:'center'}),0)}
function variant(value){enabled=new Set(sources.slice(0,5).map(s=>s[0]));if(value==='enabled')enabled.add('aihot');const url=new URL(location.href);url.searchParams.set('variant',value);history.replaceState(null,'',url);render();}
variant(new URL(location.href).searchParams.get('variant')==='enabled'?'enabled':'disabled');
document.querySelector('#options').addEventListener('change',e=>{if(!e.target.dataset.id)return; e.target.checked?enabled.add(e.target.dataset.id):enabled.delete(e.target.dataset.id);render();});
for(const id of ['settings','open'])document.querySelector('#'+id).onclick=openSettings;
document.querySelector('#close').onclick=()=>dialog.close();
for(const id of ['prev','next'])document.querySelector('#'+id).onclick=()=>variant(enabled.has('aihot')?'disabled':'enabled');
document.addEventListener('keydown',e=>{if(!dialog.open&&['ArrowLeft','ArrowRight'].includes(e.key)&&!['INPUT','TEXTAREA'].includes(e.target.tagName))variant(enabled.has('aihot')?'disabled':'enabled')});
document.querySelector('#refresh').onclick=e=>{e.target.textContent='✓ 示例刷新完成';setTimeout(()=>e.target.textContent='↻ 全部刷新',800)};
</script></body></html>

const brand=()=>`<div class="brand"><div class="wordmark">Life<span>Space</span></div><p class="brand-caption">把今天放在眼前</p></div>`;
const app=document.getElementById('app'),dock=document.getElementById('dock');
function normalizePreview(){if(['home','dashboard'].includes(state.view)&&state.scenario==='revoked'){state.view='login';state.session=false;state.allowed=false;}else if(['home','dashboard'].includes(state.view)&&state.scenario==='denied'){state.view='denied';state.scenario='normal';}if(['home','dashboard'].includes(state.view)){state.session=true;state.allowed=true;state.verified=true;}else if(['denied','reset'].includes(state.view)){state.session=true;state.allowed=false;state.verified=true;}else{state.session=false;state.allowed=false;if(state.view==='verify')state.verified=false;if(state.view==='done')state.verified=true;}}
function query(){const p=new URLSearchParams({variant:state.variant,page:state.view});if(state.scenario!=='normal')p.set('scenario',state.scenario);history.replaceState(null,'',location.pathname+'?'+p)}
function go(view,{scenario='normal',mailType}={}){state.epoch++;state.menuOpen=false;state.view=view;state.scenario=scenario;state.step=1;state.busy=false;state.status='idle';state.validation={};state.password='';state.confirm='';if(mailType)state.mailType=mailType;normalizePreview();query();render(true)}
function field(key,title,placeholder,password=false,hint=''){const val=state[key]||'',error=state.validation[key];return `<div class="field ${error?'invalid':''}"><div class="label-row"><label for="${key}">${title}</label>${key==='password'&&state.view==='login'?'<button type="button" class="link" data-go="forgot">忘记密码？</button>':''}</div><div class="field-box"><input ${password?'class="password-input"':''} id="${key}" name="${key}" type="${password?'password':'email'}" value="${esc(val)}" placeholder="${placeholder}" autocomplete="off" ${state.busy?'disabled':''} ${error?'aria-invalid="true" aria-describedby="'+key+'-error"':''}>${password?`<button type="button" class="eye" data-eye="${key}" data-password-label="${esc(title)}" aria-label="显示${title}" aria-pressed="false">${icon('eye')}</button>`:''}</div>${error?`<small class="field-error" id="${key}-error">${error}</small>`:hint?`<small>${hint}</small>`:''}</div>`}
function banner(){const s=state.scenario;if(s==='normal'||s==='loading')return '';const msgs={wrong:'邮箱或密码不正确，请检查后重试。',unverified:'请先验证邮箱，再登录 LifeSpace。',denied:'该邮箱目前没有访问资格，请联系管理员确认。',service:'服务暂时不可用，请稍后重试。',revoked:'登录状态已失效，请重新登录。',existing:'如果该邮箱已注册，请直接登录；尚未验证的账户可重新发送验证邮件。',expired:state.view==='reset'?'重置链接已过期，请重新申请邮件。':'验证链接已过期，请重新发送邮件。',quota:'发送过于频繁，请稍后再试。',pending:'密码已更新，但退出所有设备尚未完成。请重试退出，无需再次设置密码。'};let action='';if(s==='unverified'||(s==='existing'&&state.view==='register'))action='<button type="button" class="link" data-go="verify">重新发送验证邮件 →</button>';if(s==='expired'&&state.view==='reset')action='<button type="button" class="link" data-go="forgot">重新申请重置邮件 →</button>';return `<div class="banner ${['unverified','existing','quota','pending'].includes(s)?'warning':''}" role="alert">${msgs[s]||''}${action}</div>`}
function primary(text,action='submit'){const busy=state.busy||state.scenario==='loading';return `<button ${action==='submit'?'type="submit"':`type="button" data-action="${action}"`} class="primary" ${busy?'disabled aria-busy="true"':''}>${busy?'<span class="spinner"></span>':''}<span>${busy?'处理中…':text}</span></button>`}
function message(title,copy,iconName,buttons,note=''){return `<div class="center-message"><div class="status-icon ${['denied','expired'].includes(state.scenario)||state.view==='denied'?'warning':''}">${state.busy||state.scenario==='loading'?'<span class="spinner"></span>':icon(iconName)}</div><h1 tabindex="-1">${title}</h1><p class="message-copy">${copy}</p>${state.view==='verify'||state.view==='sent'||state.view==='denied'?`<div class="email-chip">${esc(state.email||'demo@example.com')}</div>`:''}${banner()}${note?`<div class="message-note">${note}</div>`:''}${buttons}</div>`}
function content(){const v=state.view;let html='';if(v==='login'||v==='register'){const reg=v==='register',stepped=state.variant==='C'&&!reg;html=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${!reg}" class="${!reg?'active':''}" data-go="login" type="button">登录</button><button role="tab" aria-selected="${reg}" class="${reg?'active':''}" data-go="register" type="button">注册</button></div><div class="auth-heading"><h1 tabindex="-1">${reg?'创建你的账户':stepped?(state.step===1?'先输入你的邮箱':'输入密码，欢迎回来'):'欢迎回来'}</h1><p>${reg?'使用已获准的邮箱，开始你的每日工作台。':stepped?'用你的账户，回到 LifeSpace。':'登录后，把今天重新放在眼前。'}</p></div>${banner()}<form id="auth-form" novalidate>${!stepped||state.step===1?field('email','邮箱','请输入邮箱'): `<div class="account-row"><span>${esc(state.email)}</span><button class="link" data-action="back-step" type="button">修改</button></div>`}${!stepped||state.step===2?field('password',reg?'设置密码':'密码',reg?'设置登录密码':'请输入密码',true,reg?'至少 8 位，建议包含字母与数字。':''):''}${reg?field('confirm','确认密码','再次输入密码',true):''}${primary(reg?'创建账户':stepped&&state.step===1?'继续':'登录 LifeSpace')}</form><div class="foot-link">${reg?'已有账户？':'还没有账户？'}<button class="link" data-go="${reg?'login':'register'}">${reg?'去登录':'创建账户'}</button></div><p class="fine-print">仅向已获准的邮箱开放访问</p>`;}
else if(v==='verify'){const expired=state.scenario==='expired';html=message(expired?'验证链接已过期':'查看你的邮箱',expired?'重新发送一封验证邮件，完成邮箱验证。':'我们已向你的邮箱发送验证邮件。<br>点击邮件中的链接，完成验证后即可登录。','mail',`<button type="button" class="primary" data-action="resend" ${state.cooldown||state.busy||state.scenario==='loading'?'disabled':''}>${state.busy||state.scenario==='loading'?'发送中…':state.cooldown?`${state.cooldown} 秒后可重发`:'重新发送验证邮件'}</button><button class="text-button" data-go="login">已验证，返回登录</button>`,'没有收到？请先检查垃圾邮件，或稍等片刻后重新发送。');}
else if(v==='forgot'){html=`<div class="back-row"><button class="link" data-go="login">← 返回登录</button></div><div class="auth-heading"><h1 tabindex="-1">忘记密码了？</h1><p>输入你的账户邮箱，我们会发送密码重置链接。</p></div>${banner()}<form id="auth-form" novalidate>${field('email','邮箱','请输入注册邮箱')}${primary('发送重置邮件')}</form><p class="fine-print">邮件链接有有效期，请及时完成操作。</p>`;}
else if(v==='sent'){html=message('检查你的邮箱','如果该邮箱已注册，你会收到一封密码重置邮件。<br>请打开邮件中的链接，设置新密码。','mail',`<button class="primary" data-go="login">返回登录</button><button class="secondary" data-action="resend" ${state.cooldown?'disabled':''}>${state.cooldown?`${state.cooldown} 秒后可重发`:'重新发送重置邮件'}</button>`,'没有收到？检查垃圾邮件，确认邮箱输入无误后重试。');}
else if(v==='reset'){if(state.scenario==='expired'){html=message('重置链接已过期','请重新申请一封邮件，再设置新密码。','lock','<button class="primary" data-go="forgot">重新申请重置邮件</button><button class="text-button" data-go="login">返回登录</button>');}else if(state.scenario==='pending'){html=message('密码已更新','最后一步尚未完成，请重试退出所有设备。','shield',primary('重试退出所有设备','retry-revoke'),'无需再次设置密码。完成后，请用新密码重新登录。');}else{html=`<div class="auth-heading"><h1 tabindex="-1">设置新的密码</h1><p>设置一个新密码，让账户继续陪你记录日常。</p></div>${banner()}<form id="auth-form" novalidate>${field('password','新密码','输入新密码',true,'至少 8 位，建议包含字母与数字。')}${field('confirm','确认新密码','再次输入新密码',true)}${primary('更新密码并退出所有设备')}</form><p class="fine-print">完成后，所有浏览器都需要用新密码重新登录。</p>`;}}
else if(v==='done'){html=message('密码已更新','所有设备已退出。<br>请使用新密码重新登录 LifeSpace。','check','<button class="primary" data-go="login">使用新密码登录</button>');}
else if(v==='denied'){html=message('暂时没有访问资格','当前账户暂未获准进入 LifeSpace。<br>请联系管理员确认你的邮箱是否已加入白名单。','shield',primary('退出并切换账户','switch-account'),'已注册或已登录的账户，也需要具备当前访问资格。');}
else if(v==='home'){html=message('欢迎回到 LifeSpace','登录与访问资格已确认。<br>进入首页，开始今天的日常。','check',primary('进入首页','enter-home'));}
return `<section class="auth-card" aria-label="${labels[v]}">${html}</section>`;}
function renderAccount(){document.getElementById('account-root').innerHTML=`<button type="button" class="avatar-button" data-action="toggle-account" aria-label="打开账户菜单" aria-expanded="${state.menuOpen}" aria-controls="account-dropdown">${state.session?'D':icon('user')}</button>${state.menuOpen?`<div class="account-dropdown" id="account-dropdown" role="menu" aria-label="账户菜单"><div class="account-heading"><strong>${state.session?'当前账户':'尚未登录'}</strong><small>${state.session?esc(state.email||'demo@example.com'):'登录后可管理当前会话'}</small></div><button type="button" role="menuitem" class="logout-menu-item" data-action="switch-account" ${!state.session||state.busy?'disabled':''}>${icon('logout')}退出登录</button></div>`:''}`;}
function homePanel(kind,title,iconName,body){return `<article class="info-panel panel-${kind}"><div class="panel-heading"><span>${icon(iconName)}<h2>${title}</h2></span>${icon('arrow')}</div><div class="panel-open">${body}</div><div class="panel-footer"><span>演示数据 · 09:41 更新</span></div></article>`;}
function homePreview(){
 const clockCol=(local,name,zone,date,time)=>`<div class="clock-column ${local?'local-clock':'world-clock'}"><div class="clock-label">${icon('clock')}<span>${name}</span><small>${zone}</small></div><p>${date}</p><strong>${time}</strong></div>`;
 const time=homePanel('time','世界时间','clock',`<div class="time-content">${clockCol(true,'北京','UTC+8','2026 / 10 / 11 · 星期日','09:41')}${clockCol(false,'纽约','UTC−4','2026 / 10 / 10','21:41')}${clockCol(false,'伦敦','UTC+1','2026 / 10 / 11','02:41')}</div>`);
 const weather=homePanel('weather','今日天气','sun','<div class="location">北京<span>晴</span></div><div class="weather-hero"><strong>23<sup>°</sup></strong><div class="weather-symbol">'+icon('sun')+'</div></div><div class="weather-range"><span>最高 26°</span><i></i><span>最低 18°</span></div><div class="rain-note">今日降雨概率<strong>10%</strong></div>');
 const tasks=homePanel('tasks','今日待办','list','<div class="task-content"><div class="task-count"><strong>03</strong><span>件事，慢慢做好</span></div><div class="task-list">'+['整理本周笔记','安排明日计划','读一章书'].map((t,i)=>`<div class="task-row"><span class="task-number">0${i+1}</span><div><strong>${t}</strong><span>${['10:00','14:00','20:00'][i]}<i></i>日常</span></div>${icon('arrow')}</div>`).join('')+'</div></div>');
 const calendar=homePanel('calendar','日期与黄历','calendar','<div class="calendar-content"><div class="calendar-day"><span>2026 年 10 月</span><strong>11</strong><p>星期日</p></div><div class="lunar-summary"><span>农历信息示例</span><div><b>宜</b><p>阅读 · 整理</p></div><div><b>忌</b><p>仅作排版示例</p></div></div></div>');
 const domains=homePanel('domains','DNSHE 域名','globe','<div class="domain-content"><div class="domain-summary"><strong>02</strong><span>个域名</span><small>账户展示示例</small></div><div class="domain-list"><div class="domain-row"><strong>lifespace.example.com</strong><span>已注册 · 剩余 365 天</span></div><div class="domain-row"><strong>notes.example.com</strong><span>已注册 · 剩余 120 天</span></div></div></div>');
 const ai=homePanel('ai','AI 服务状态','chart','<div class="demo-status"><span>OpenAI</span><b>示例：正常</b></div><div class="demo-status"><span>xAI</span><b>示例：正常</b></div>');
 return `<div class="lifespace-app theme-light home-preview"><aside class="sidebar" aria-label="主导航"><div class="brand-mark"><img src="/favicon.svg" alt="LifeSpace" width="38" height="38"></div><nav><button class="nav-item active" aria-current="page">${icon('house')}<span>首页</span></button>${[['news','新闻'],['list','任务管理'],['target','个人目标'],['wallet','财务'],['chart','股票行情']].map(([i,t])=>`<button class="nav-item" disabled>${icon(i)}<span>${t}</span></button>`).join('')}</nav><button class="nav-settings" disabled aria-label="设置">${icon('settings')}<span>设置</span></button></aside><div class="home-preview-main"><div class="home-page"><header class="masthead"><div class="page-kicker"><span class="live-dot"></span>我的每日空间</div><button class="top-settings" disabled aria-label="首页设置">${icon('settings')}</button><h1 class="wordmark" tabindex="-1">Life<span>Space</span><i></i></h1><p class="header-date">把今天放在眼前</p><form class="search-box" id="mock-search" role="search"><span class="google-mark">G</span><input aria-label="Google 搜索" placeholder="搜索一下，找到你想知道的"><span class="search-hint">Google</span><button type="submit" aria-label="搜索">${icon('search')}</button></form></header><section class="glass-grid" aria-label="每日信息">${time}${weather}${tasks}${calendar}${domains}${ai}</section><p class="page-note">生活有自己的节奏，今天也一样。</p></div></div></div>`;
}
function layout(){if(state.view==='dashboard')return homePreview();const c=content();if(state.variant==='A')return `<div class="screen layout-A">${brand()}<div class="auth-wrap">${c}<p class="outside-note">一个入口，回到你的日常</p></div></div>`;if(state.variant==='B')return `<div class="screen layout-B"><section class="story">${brand()}<h2>每天的小事，<br>都有归处。</h2><p>时间、天气、信息与待办。<br>把日常放在一起，让今天更从容。</p><div class="story-art" aria-hidden="true"><div class="art-tile">${icon('clock')}留一点时间给自己</div><div class="art-tile">${icon('sun')}打开今天的好天气</div><div class="art-tile">${icon('leaf')}让日常慢慢有序</div></div><div class="story-foot"><img src="/favicon.svg" alt="">LifeSpace · 你的每日工作台</div></section><div class="auth-wrap">${c}</div></div>`;return `<div class="screen layout-C"><header class="c-header">${brand()}<nav aria-label="账户入口"><button class="link ${state.view==='login'?'active':''}" data-go="login">登录</button><button class="link ${state.view==='register'?'active':''}" data-go="register">创建账户</button></nav></header><div class="c-shell"><section class="c-intro"><div class="intro-icon">${icon(state.view==='denied'?'shield':'leaf')}</div><h2>${state.view==='login'?'从一个邮箱，<br>开始今天。':'你的日常，<br>就在这里。'}</h2><p>用一个简单的入口，回到你的每日工作台。</p>${state.view==='login'?`<div class="steps"><span class="step-dot ${state.step===1?'current':''}">1</span><span>邮箱</span><i></i><span class="step-dot ${state.step===2?'current':''}">2</span><span>密码</span></div>`:''}<p class="intro-bottom">LifeSpace · 把今天放在眼前</p></section><div class="auth-wrap">${c}</div></div></div>`;}
function dockContent(){if(!state.dock)return '<button class="dock-minimize" data-action="show-dock">显示原型面板</button>';const variants={A:'居中卡片',B:'左右分栏',C:'分步入口'},demo=state.view==='verify'?'<button class="demo-action" data-action="verified">模拟点击验证邮件</button>':state.view==='sent'?'<button class="demo-action" data-action="open-reset">模拟打开重置链接</button>':'<button data-action="fill-demo">填入演示内容</button>';return `<section class="dock" aria-label="原型预览控制"><div class="dock-row"><div class="switcher"><button class="arrow" data-cycle="-1" aria-label="上一个布局">‹</button><span class="variant-label">${state.variant} · ${variants[state.variant]}</span><button class="arrow" data-cycle="1" aria-label="下一个布局">›</button></div><div class="divider"></div><div class="controls"><label><span>页面</span><select id="page-select" aria-label="选择原型页面">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${state.view===k?'selected':''}>${v}</option>`).join('')}</select></label><label><span>状态</span><select id="scene-select" aria-label="选择异常状态">${scenes[state.view].map(k=>`<option value="${k}" ${state.scenario===k?'selected':''}>${sceneLabels[k]}</option>`).join('')}</select></label>${demo}<button data-action="hide-dock">收起面板</button></div></div><div class="dock-bottom"><span id="state-summary"></span><span>仅内存模拟 · 不连接真实服务</span></div><details><summary>查看当前模拟状态</summary><pre id="state-json"></pre></details></section>`;}
function snapshot(){return {布局:state.variant,页面:labels[state.view],场景:sceneLabels[state.scenario],步骤:state.step,操作状态:state.status,邮箱已填写:!!state.email,密码已填写:!!state.password,已验证邮箱:state.verified,具有模拟会话:state.session,准入已通过:state.allowed,重发等待秒数:state.cooldown,网络请求:'无',输入持久化:'无'}}
function updateState(){const summary=document.getElementById('state-summary'),json=document.getElementById('state-json');if(summary)summary.textContent=`${labels[state.view]} · ${sceneLabels[state.scenario]} · ${state.status==='busy'?'处理中':state.status==='error'?'操作未完成':state.status==='success'?'操作已完成':'等待操作'}`;if(json)json.textContent=JSON.stringify(snapshot(),null,2)}
function render(focus=false){app.classList.toggle('home-active',state.view==='dashboard');app.innerHTML=layout();dock.innerHTML=dockContent();renderAccount();updateState();if(focus)app.querySelector('h1')?.focus({preventScroll:true})}
function cycle(delta){const v=['A','B','C'];state.variant=v[(v.indexOf(state.variant)+delta+3)%3];state.step=1;state.busy=false;state.menuOpen=false;state.epoch++;query();render()}
function validate(){state.validation={};if(['login','register','forgot'].includes(state.view)&&(!state.email||!/^\S+@\S+\.\S+$/.test(state.email)))state.validation.email='请输入有效的邮箱地址。';if(['register','reset'].includes(state.view)){if(state.password.length<8)state.validation.password='密码至少需要 8 位。';if(!state.confirm||state.confirm!==state.password)state.validation.confirm='两次输入的密码需要一致。'}else if(state.view==='login'&&(state.variant!=='C'||state.step===2)&&!state.password)state.validation.password='请输入密码。';if(Object.keys(state.validation).length){state.status='error';render();app.querySelector('[aria-invalid="true"]')?.focus();return false}return true}
function simulate(action){if(state.busy||state.scenario==='loading')return;const epoch=++state.epoch;state.busy=true;state.status='busy';render();setTimeout(()=>{if(epoch!==state.epoch)return;state.busy=false;action();},650)}
function submit(){if(!validate())return;if(state.variant==='C'&&state.view==='login'&&state.step===1){state.step=2;render();document.getElementById('password')?.focus();return}simulate(()=>{const view=state.view,s=state.scenario;if(view==='login'){if(s==='denied'){state.session=true;state.allowed=false;go('denied');return}if(s==='unverified'){state.session=false;state.verified=false;go('verify');return}if(['wrong','service','revoked'].includes(s)){state.status='error';render();return}state.verified=true;state.session=true;state.allowed=true;go('home');state.status='success';updateState();}else if(view==='register'){if(['denied','existing','service'].includes(s)){state.status='error';render();return}state.verified=false;state.session=false;go('verify');state.status='success';updateState();}else if(view==='forgot'){if(['quota','service'].includes(s)){state.status='error';render();return}go('sent',{mailType:'recovery'});state.status='success';updateState();}else if(view==='reset'){if(s==='service'){state.status='error';render();return}state.session=false;state.allowed=false;go('done');state.status='success';updateState();}})}
document.addEventListener('input',e=>{if(['email','password','confirm'].includes(e.target.name)){state[e.target.name]=e.target.value;updateState()}});
document.addEventListener('submit',e=>{if(e.target.id==='mock-search'){e.preventDefault();return}if(e.target.id==='auth-form'){e.preventDefault();submit()}});
document.addEventListener('change',e=>{if(e.target.id==='page-select'){go(e.target.value);return}if(e.target.id==='scene-select'){state.epoch++;state.scenario=e.target.value;state.busy=false;state.status='idle';state.validation={};normalizePreview();query();render();return}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.cycle){cycle(Number(b.dataset.cycle));return}if(b.dataset.eye){const input=document.getElementById(b.dataset.eye),show=input.type==='password';input.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',(show?'隐藏':'显示')+b.dataset.passwordLabel);b.innerHTML=icon(show?'eyeOff':'eye');return}const a=b.dataset.action;if(a==='enter-home'){go('dashboard');return}if(a==='fill-demo'){state.email='demo@example.com';state.password='LifeSpace2026!';state.confirm='LifeSpace2026!';state.validation={};render();return}if(a==='back-step'){state.step=1;render();return}if(a==='hide-dock'){state.dock=false;render();return}if(a==='show-dock'){state.dock=true;render();return}if(a==='verified'){state.verified=true;state.session=false;go('login');state.status='success';updateState();return}if(a==='open-reset'){state.session=true;state.verified=true;go('reset');return}if(a==='toggle-account'){state.menuOpen=!state.menuOpen;renderAccount();return}if(a==='switch-account'){state.menuOpen=false;simulate(()=>{if(state.scenario==='service'){state.status='error';render();return}state.session=false;state.allowed=false;state.email='';go('login');state.status='success';updateState()});return}if(a==='retry-revoke'){simulate(()=>{state.session=false;state.allowed=false;go('done');state.status='success';updateState()});return}if(a==='resend'){simulate(()=>{if(['service','quota'].includes(state.scenario)){state.status='error';render();return}state.scenario='normal';state.cooldown=30;state.status='success';query();render()});return}});
document.addEventListener('click',e=>{if(state.menuOpen&&!e.composedPath().includes(document.getElementById('account-root'))){state.menuOpen=false;renderAccount()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menuOpen){state.menuOpen=false;renderAccount();document.querySelector('.avatar-button')?.focus();return}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
setInterval(()=>{if(state.cooldown>0){state.cooldown--;const btn=document.querySelector('[data-action="resend"]');if(btn){btn.disabled=state.cooldown>0;btn.textContent=state.cooldown?`${state.cooldown} 秒后可重发`:state.view==='sent'?'重新发送重置邮件':'重新发送验证邮件'}updateState()}},1000);
normalizePreview();query();render();
</script></body></html>

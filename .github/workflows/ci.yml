name: CI

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
      - name: Scan secrets first
        run: npm run check:secrets
      - run: npm run test:secrets

  api:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: test:api

  security:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: test:security:portable

  build:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: build

  browser_1:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 1

  browser_2:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 2

  browser_3:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 3

  browser_4:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 4

  # Keep the branch protection check stable and fail closed for every dependency,
  # including skipped or cancelled jobs. Each shard is a separate dependency.
  validate:
    name: validate
    if: ${{ always() }}
    needs: [secrets, api, security, build, browser_1, browser_2, browser_3, browser_4]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = Object.entries(JSON.parse(process.env.NEEDS))
            const failed = jobs.filter(([, job]) => job.result !== "success")
            for (const [name, job] of failed) console.error(`${name}: ${job.result}`)
            if (jobs.length === 0 || failed.length) process.exit(1)
          '

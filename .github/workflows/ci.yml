name: CI

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Scan secrets first
        run: npm run check:secrets
      - run: npm run test:secrets

  api:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: test:api

  security:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: test:security:portable

  build:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: build

  browser_1:
    if: ${{ false }}
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 1

  browser_2:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 2

  browser_3:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 3

  browser_4:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 4

  # Keep the branch protection check stable and fail closed for every dependency,
  # including skipped or cancelled jobs. Each shard is a separate dependency.
  validate:
    name: validate
    if: ${{ always() }}
    needs: [secrets, api, security, build, browser_1, browser_2, browser_3, browser_4]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = Object.entries(JSON.parse(process.env.NEEDS))
            const failed = jobs.filter(([, job]) => job.result !== "success")
            for (const [name, job] of failed) console.error(`${name}: ${job.result}`)
            if (jobs.length === 0 || failed.length) process.exit(1)
          '

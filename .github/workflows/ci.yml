name: CI

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
      - name: Scan secrets first
        run: npm run check:secrets
      - run: npm run test:secrets

  api:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: test:api

  security:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: test:security:portable

  token_database:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare isolated PostgreSQL and pinned PostgREST
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
            sudo apt-get install -y postgresql-17
          fi
          mkdir -p .cache/token-postgrest
          curl --fail --location --retry 2 --max-time 120 https://github.com/PostgREST/postgrest/releases/download/v13.0.7/postgrest-v13.0.7-linux-static-x86-64.tar.xz --output .cache/token-postgrest/postgrest.tar.xz
          printf '%s  %s\n' '4153f81ccc40e7b735edc89cd84b49da25ba27eb37d57c7f6a82c9005a0b762b' '.cache/token-postgrest/postgrest.tar.xz' | sha256sum --check
          tar -xJf .cache/token-postgrest/postgrest.tar.xz -C .cache/token-postgrest
      - name: Install browser for real React and database flow
        run: PLAYWRIGHT_BROWSERS_PATH=.cache/playwright npx playwright install --with-deps chromium
      - name: Test real transactions, direct RPC headers and React device flow
        env:
          POSTGRES_BIN: /usr/lib/postgresql/17/bin
          POSTGREST_BIN: ${{ github.workspace }}/.cache/token-postgrest/postgrest
          PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
        run: npm run test:token-database
      - name: Pack and install collector outside repository; scan and upgrade
        run: npm run test:collector-package

  build:
    needs: secrets
    uses: ./.github/workflows/ci-check.yml
    with:
      command: build

  collector_macos:
    needs: secrets
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Installed package, real identity probe, synthetic scan and upgrade
        run: npm run test:collector-package
      - name: Real launchd install, execution, heartbeat and uninstall
        env:
          TOKEN_SCHEDULER_CI: disposable
        run: npm run test:collector-scheduler

  collector_linux:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare real systemd user manager on disposable runner
        shell: bash
        run: |
          collector_uid=$(id -u)
          sudo systemctl start "user@${collector_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/${collector_uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          test -S "${XDG_RUNTIME_DIR}/bus"
          systemctl --user show-environment >/dev/null
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
      - name: Real systemd timer install, execution, heartbeat and uninstall
        env:
          TOKEN_SCHEDULER_CI: disposable
        run: npm run test:collector-scheduler

  browser_1:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 1

  browser_2:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 2

  browser_3:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 3

  browser_4:
    needs: secrets
    uses: ./.github/workflows/ci-browser.yml
    with:
      shard: 4

  # Keep the branch protection check stable and fail closed for every dependency,
  # including skipped or cancelled jobs. Each shard is a separate dependency.
  validate:
    name: validate
    if: ${{ always() }}
    needs: [secrets, api, security, token_database, collector_macos, collector_linux, build, browser_1, browser_2, browser_3, browser_4]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = Object.entries(JSON.parse(process.env.NEEDS))
            const failed = jobs.filter(([, job]) => job.result !== "success")
            for (const [name, job] of failed) console.error(`${name}: ${job.result}`)
            if (jobs.length === 0 || failed.length) process.exit(1)
          '

name: CI

on:
  pull_request:
    branches: [main, preview, 'codex/**']
  push:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      ledger-postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      adventure-postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Scan secrets first
        run: npm run check:secrets
      - run: npm run test:secrets
      - run: npm ci
      - run: npm run build:ci
      - name: Install pinned legacy comparison transport
        run: node scripts/install-database-test-tools.mjs
      - name: Install Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=.cache/playwright npx playwright install --with-deps chromium
      - name: Real PostgreSQL and production workerd entry point
        env:
          POSTGREST_BIN: ${{ github.workspace }}/.cache/postgrest/postgrest
        run: |
          CI_POSTGRES_PORT=5432 npm run test:database -- --ledger --runtime --browser
          CI_POSTGRES_PORT=5433 npm run test:database -- --browser
      - run: npm run test:browser

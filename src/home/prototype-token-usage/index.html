let heatMode='year';
const heatModes={year:'近 1 年热力图',iso:'近 1 年 3D 等距热力图'};
const recent=Object.fromEntries(days.map((d,i)=>[`2026-10-${String(29-i).padStart(2,'0')}`,{value:parseFloat(d.total),status:d.status==='部分覆盖'?'partial':'known'}]));
function daily(date){
  if(date>'2026-10-29')return {status:'future'};
  if(recent[date])return recent[date];
  const n=Number(date.slice(-2)),m=Number(date.slice(5,7));
  if(n===4||n===13)return {status:'unknown'};
  if(n===6||n===18)return {status:'zero',value:0};
  return {status:n===2?'partial':'known',value:Number((0.2+((n*13+m*7)%25)/10).toFixed(2))};
}
function level(value){return value===0?'h0':value<0.6?'h1':value<1.4?'h2':value<2.1?'h3':'h4'}
function item(date,scale=1,prefix=''){
  let x=daily(date),value=x.value===undefined?undefined:Number((x.value*scale).toFixed(2));
  let state=x.status==='unknown'?'覆盖未知，用量未知':x.status==='future'?'未来日期':x.status==='zero'?'已确认零用量，0 Token':`${x.status==='partial'?'部分覆盖，已知 ':'已知 '}${value.toFixed(2)}M Token`;
  return {className:x.status==='unknown'?'unknown':x.status==='future'?'future':level(value)+(x.status==='partial'?' partial':''),info:`${prefix}${date} · 北京时间 · ${state}`};
}
function cell(data,label='',extra='') {return `<button type="button" class="heat-cell ${data.className}" data-heat-info="${data.info}" title="${data.info}" aria-label="${data.info}" ${extra}>${label}</button>`}
function annual(){
  // 示例中的“今天”为 2026-10-29；按 UTC 日期运算表示北京时间的日历日期，避免时区和闰日误差。
  const lastDay=new Date(Date.UTC(2026,9,29));
  const firstDay=new Date(lastDay.getTime()-364*86400000);
  const firstWeekday=firstDay.getUTCDay();
  const columns=Math.ceil((firstWeekday+365)/7);
  let out='',labels='';
  for(let i=0;i<firstWeekday;i++)out+='<span class="heat-cell blank" aria-hidden="true"></span>';
  for(let i=0;i<365;i++){
    const d=new Date(firstDay.getTime()+i*86400000);
    const key=d.toISOString().slice(0,10);
    if(i===0||d.getUTCDate()===1){
      const column=Math.floor((firstWeekday+i)/7)+1;
      labels+=`<span style="grid-column:${column}">${d.getUTCMonth()+1}月</span>`;
    }
    out+=cell(item(key),'',variant==='A1'?`data-heat-index="${i}" tabindex="${i===heatIndex?0:-1}"`:'');
  }
  return `<div class="year-labels" style="grid-template-columns:repeat(${columns},17px)">${labels}</div><div class="year-body"><div class="year-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="heat-annual">${out}</div></div>`;
}
function heatmap(){
 const is3d=heatMode==='iso';
 const title=is3d?'近 1 年 · 3D 等距':'近 1 年 · 每日一格';
 const body=is3d?`<div class="heat-iso">${annual()}</div>`:annual();
 const note=is3d?'与近 1 年热力图使用同一组每日数据，仅展示角度不同。':'横向按周，纵向按星期；展示截至示例日期的最近 365 天。';
 return `<section class="card heatmap"><div class="sectionhead"><h2>Token 热力图</h2><span class="muted">合成数据 · ${title}</span></div><div class="heat-tabs" aria-label="热力图形式">${Object.entries(heatModes).map(([k,v])=>`<button type="button" data-heat-mode="${k}" aria-pressed="${k===heatMode}">${v}</button>`).join('')}</div><p class="muted">${note} ${variant==='A1'?'使用方向键选择日期，或点击、悬停查看详情。':'点击、悬停或聚焦色块查看详情。'}</p>${variant==='A1'?'<p class="scroll-hint">左右滑动查看其他日期</p>':''}<div class="heat-scroll">${body}</div><div id="heat-detail" class="heat-detail" aria-live="polite">选择色块查看日期、数值和覆盖状态。</div><div class="heat-legend" aria-label="热力图图例"><span><i class="h0"></i>已确认零用量</span><span><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i>已知用量由少到多</span><span><i class="partial"></i>部分覆盖</span><span><i class="unknown"></i>覆盖未知</span></div></section>`;
}


// 示例数值以 0.01M 为单位；每天各模型之和等于对应的每日总量。
const modelSamples=[[125,79,18],[150,96,25],[86,58,16],[64,48,10],[77,58,10],[57,43,10],[110,75,15]];
const modelColors=['var(--model-a)','var(--model-b)','var(--model-unknown)'];
function modelChart(){
  const legend=models.map((m,i)=>`<span><i style="background:${modelColors[i]}"></i>${m.name}</span>`).join('');
  const bars=[...days].map((d,i)=>({d,i})).reverse().map(({d,i})=>{
    const values=modelSamples[i];
    const summary=`${d.date} · 已知总量 ${d.total} Token · ${d.status} · `+models.map((m,j)=>`${m.name} ${(values[j]/100).toFixed(2)}M`).join(' · ');
    const height=Math.round(values.reduce((a,b)=>a+b,0)/271*150);
    return `<button type="button" class="model-bar" data-bar-info="${summary}" aria-label="${summary}"><span class="model-bar-value">${d.total}</span><span class="model-bar-stack ${d.status==='部分覆盖'?'partial':''}" style="height:${height}px">${values.map((v,j)=>`<span style="height:${v/values.reduce((a,b)=>a+b,0)*100}%;background:${modelColors[j]}"></span>`).join('')}</span><span class="model-bar-date">${d.date.slice(0,5)}</span><span class="model-bar-tooltip" aria-hidden="true"><strong>${d.date}</strong><span>已知总量 ${d.total} Token · ${d.status}</span>${models.map((m,j)=>`<span><i style="background:${modelColors[j]}"></i>${m.name} ${(values[j]/100).toFixed(2)}M</span>`).join('')}</span></button>`;
  }).join('');
  return `<section class="card model-chart"><div class="sectionhead"><h2>近 7 天 Token 用量</h2><span class="muted">按模型分色 · 北京时间</span></div><div class="model-chart-legend">${legend}<span><i class="coverage-key"></i>部分覆盖</span></div>${variant==='A1'?'<p class="scroll-hint">左右滑动查看其他日期</p>':''}<div class="model-chart-scroll"><div class="model-bars">${bars}</div></div><div id="model-chart-detail" class="model-chart-detail" aria-live="polite">悬停、点击或聚焦柱子可查看各模型用量。</div><p class="muted">示例数据；斜纹轮廓表示部分覆盖，仅包含已收到的用量。未知模型单独显示，未知或未同步用量不按零计算。筛选仅演示，不改变示例数据。</p></section>`;
}

const filters=()=>`当前筛选：${document.querySelector('#date').value} · ${document.querySelector('#agent').value} · ${document.querySelector('#model').value} · ${document.querySelector('#device').value}。示例数字仅用于比较布局，不随筛选计算。`;
function metric(label,value,caption){return `<div class="card metric"><small>${label}</small><strong>${value}</strong><span class="muted">${caption}</span></div>`}
function render(options={}){
 const oldHeat=document.querySelector('.heat-scroll');
 const oldChart=document.querySelector('.model-chart-scroll');
 const heatScroll=oldHeat?.scrollLeft,chartScroll=oldChart?.scrollLeft;
 document.body.dataset.variant=variant;
 const sw=document.querySelector('.switch');
 if(variant==='A1')document.querySelector('.header').append(sw);else document.body.append(sw);
 document.querySelector('#app').innerHTML=`${disclaimer}<div class="metrics">${metric('今日总 Token',days[0].total,'已知部分')}${metric('输入 / 输出',days[0].input+' / '+days[0].output,'输入 / 输出')}${metric('缓存命中率',days[0].cache,'口径待确认')}${metric('今日费用',days[0].cost,'实际费用未知')}</div><div class="split">${modelChart()}<div class="card"><h2>设备与覆盖</h2>${devices}</div></div>${modelBreakdown}${heatmap()}`;
 if(variant==='A1'){
  const narrow=window.matchMedia('(max-width:850px)').matches;
  for(const [selector,previous] of [['.heat-scroll',heatScroll],['.model-chart-scroll',chartScroll]]){
   const container=document.querySelector(selector);
   if(narrow && (options.resetScroll || previous===undefined))container.scrollLeft=container.scrollWidth;
   else if(!options.resetScroll && previous!==undefined)container.scrollLeft=previous;
  }
 }
 if(variant==='A1'){
  for(const [selector,key] of [['.heat-scroll','heat'],['.model-chart-scroll','chart']]){
   const container=document.querySelector(selector);
   for(const eventName of ['wheel','touchstart','pointerdown','keydown'])container.addEventListener(eventName,()=>{userScrolled[key]=true;userPositions[key]=container.scrollLeft},{passive:true});
   container.addEventListener('scroll',()=>{if(userScrolled[key]&&!resizing)userPositions[key]=container.scrollLeft},{passive:true});
  }
 }
 for(const key of Object.keys(names))document.querySelector('#choose'+key).setAttribute('aria-pressed',String(key===variant));
 document.querySelectorAll('[data-heat-mode]').forEach(el=>el.onclick=()=>{const mode=el.dataset.heatMode;if(mode===heatMode)return;const previous=document.querySelector('.heat-scroll'),scroll=previous.scrollLeft,atEnd=previous.scrollWidth-previous.clientWidth-scroll<2;heatMode=mode;render();const next=document.querySelector('.heat-scroll');next.scrollLeft=variant==='A1'&&atEnd?next.scrollWidth:scroll;document.querySelector(`[data-heat-mode="${mode}"]`).focus({preventScroll:true})});
 document.querySelectorAll('[data-bar-info]').forEach(el=>{const show=()=>{document.querySelector('#model-chart-detail').textContent=el.dataset.barInfo};el.onclick=show;el.onfocus=show;el.onmouseenter=show});
 document.querySelectorAll('[data-heat-info]').forEach(el=>{
  const show=()=>{document.querySelector('#heat-detail').textContent=el.dataset.heatInfo};el.onclick=()=>{show();if(variant==='A1')setHeatFocus(Number(el.dataset.heatIndex),true)};el.onfocus=show;el.onmouseenter=show;
  if(variant==='A1')el.onkeydown=e=>{const offsets={ArrowLeft:-7,ArrowRight:7,ArrowUp:-1,ArrowDown:1,Home:-heatIndex,End:364-heatIndex};if(!(e.key in offsets))return;e.preventDefault();e.stopPropagation();setHeatFocus(Math.max(0,Math.min(364,heatIndex+offsets[e.key])),true)};
 });
}
function setHeatFocus(index,focus){const cells=[...document.querySelectorAll('[data-heat-index]')];if(!cells[index])return;heatIndex=index;cells.forEach((el,i)=>el.tabIndex=i===index?0:-1);if(focus)cells[index].focus();}
function choose(key){if(key==='A1'&&variant!=='A1'){userScrolled={heat:false,chart:false};userPositions={heat:0,chart:0}}variant=key;let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render({resetScroll:true});document.querySelector('#choose'+key).focus({preventScroll:true})}
window.addEventListener('resize',()=>{
 const narrow=window.matchMedia('(max-width:850px)').matches;
 resizing=true;
 if(narrow&&!wasNarrow&&variant==='A1'){
  for(const [selector,key] of [['.heat-scroll','heat'],['.model-chart-scroll','chart']]){
   const container=document.querySelector(selector);
   if(container)container.scrollLeft=userScrolled[key]?userPositions[key]:container.scrollWidth;
  }
 }
 wasNarrow=narrow;
 requestAnimationFrame(()=>{resizing=false});
});
document.querySelector('#chooseA').onclick=()=>choose('A');document.querySelector('#chooseA1').onclick=()=>choose('A1');document.querySelectorAll('select').forEach(x=>x.onchange=render);render();
</script></body></html>
